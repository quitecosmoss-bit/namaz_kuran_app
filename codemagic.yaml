workflows:
  android-test-build:
    name: Android Test Build (APK)
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Eksikse Android platform klasörünü oluştur
        script: |
          flutter create --platforms=android --org com.namazkuran --project-name namaz_kuran_app .
      - name: Uygulamanın compileSdk sürümünü yükselt
        script: |
          FILE=""
          if [ -f android/app/build.gradle.kts ]; then
            FILE=android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            FILE=android/app/build.gradle
          fi
          if [ -n "$FILE" ]; then
            sed -i.bak 's/flutter\.compileSdkVersion/36/g' "$FILE"
            rm -f "$FILE.bak"
          fi
      - name: Tüm alt modüllerin (paketler dahil) compileSdk'sini zorla yükselt
        script: |
          KTS=android/build.gradle.kts
          GROOVY=android/build.gradle
          if [ -f "$KTS" ]; then
            {
              echo "subprojects {"
              echo "    afterEvaluate {"
              echo "        extensions.findByName(\"android\")?.withGroovyBuilder {"
              echo "            setProperty(\"compileSdkVersion\", 36)"
              echo "        }"
              echo "    }"
              echo "}"
              echo ""
              cat "$KTS"
            } > "$KTS.new"
            mv "$KTS.new" "$KTS"
            echo "Eklendi (dosyanın başına): $KTS"
          elif [ -f "$GROOVY" ]; then
            {
              echo "subprojects {"
              echo "    afterEvaluate { proj ->"
              echo "        if (proj.hasProperty('android')) {"
              echo "            proj.android {"
              echo "                compileSdkVersion 36"
              echo "            }"
              echo "        }"
              echo "    }"
              echo "}"
              echo ""
              cat "$GROOVY"
            } > "$GROOVY.new"
            mv "$GROOVY.new" "$GROOVY"
            echo "Eklendi (dosyanın basina): $GROOVY"
          fi
      - name: Java/Kotlin JVM hedef uyumsuzluğunu düzelt
        script: |
          # Bazı paketler (flutter_timezone, flutter_tts gibi) Kotlin Gradle
          # Plugin uyguluyor ve varsayılan Kotlin JVM hedefi (1.8), ana
          # projenin Java hedefiyle (11) uyuşmuyor, bu da "Inconsistent JVM
          # Target Compatibility" derleme hatasına yol açıyor. Tüm alt
          # modüllerde (paketler dahil) hem Java hem Kotlin derleme hedefini
          # 11 olarak zorluyoruz.
          KTS=android/build.gradle.kts
          GROOVY=android/build.gradle
          if [ -f "$KTS" ]; then
            {
              echo "subprojects {"
              echo "    afterEvaluate {"
              echo "        extensions.findByName(\"android\")?.withGroovyBuilder {"
              echo "            \"compileOptions\" {"
              echo "                setProperty(\"sourceCompatibility\", JavaVersion.VERSION_17)"
              echo "                setProperty(\"targetCompatibility\", JavaVersion.VERSION_17)"
              echo "            }"
              echo "        }"
              echo "        extensions.findByType(org.jetbrains.kotlin.gradle.dsl.KotlinAndroidProjectExtension::class.java)?.compilerOptions {"
              echo "            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)"
              echo "        }"
              echo "    }"
              echo "}"
              echo ""
              cat "$KTS"
            } > "$KTS.new"
            mv "$KTS.new" "$KTS"
            echo "Eklendi (dosyanın başına): $KTS"
          elif [ -f "$GROOVY" ]; then
            {
              echo "subprojects {"
              echo "    afterEvaluate { proj ->"
              echo "        if (proj.hasProperty('android')) {"
              echo "            proj.android.compileOptions {"
              echo "                sourceCompatibility JavaVersion.VERSION_17"
              echo "                targetCompatibility JavaVersion.VERSION_17"
              echo "            }"
              echo "        }"
              echo "    }"
              echo "    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {"
              echo "        kotlinOptions { jvmTarget = \"17\" }"
              echo "    }"
              echo "}"
              echo ""
              cat "$GROOVY"
            } > "$GROOVY.new"
            mv "$GROOVY.new" "$GROOVY"
            echo "Eklendi (dosyanın basina): $GROOVY"
          fi
      - name: Manifest izinlerini ve AdMob/TTS ayarlarını ekle
        script: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # NOT: <manifest ...> ve <application ...> etiketleri bazı Flutter
          # surumlerinde birden fazla satira yayilabiliyor (her ozellik ayri
          # satirda). Bu yuzden satirin ">" ile bittigi noktayi bulup, EKLEME
          # islemini ancak etiket TAMAMEN kapandiktan sonra yapiyoruz.
          if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            awk '
              BEGIN { in_tag=0; done=0 }
              {
                print
                if ($0 ~ /<manifest/) { in_tag=1 }
                if (in_tag && !done && $0 ~ />/) {
                  print "    <uses-permission android:name=\"android.permission.INTERNET\" />"
                  print "    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />"
                  print "    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />"
                  print "    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />"
                  print "    <uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\" />"
                  print "    <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\" />"
                  print "    <queries>"
                  print "        <intent>"
                  print "            <action android:name=\"android.intent.action.TTS_SERVICE\" />"
                  print "        </intent>"
                  print "    </queries>"
                  done=1
                  in_tag=0
                }
              }
            ' "$MANIFEST" > "$MANIFEST.tmp"
            mv "$MANIFEST.tmp" "$MANIFEST"
          fi
          if ! grep -q "APPLICATION_ID" "$MANIFEST"; then
            awk '
              BEGIN { in_tag=0; done=0 }
              {
                print
                if ($0 ~ /<application/) { in_tag=1 }
                if (in_tag && !done && $0 ~ />/) {
                  print "        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-3940256099942544~3347511713\" />"
                  done=1
                  in_tag=0
                }
              }
            ' "$MANIFEST" > "$MANIFEST.tmp2"
            mv "$MANIFEST.tmp2" "$MANIFEST"
          fi
      - name: Paketleri indir
        script: flutter pub get
      - name: Testleri çalıştır (varsa)
        script: flutter test || true
      - name: Debug APK derle (imzasız, hızlı test için)
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  # Play Store'a yüklenecek release build için, keystore (imzalama anahtarı)
  # hazır olduğunda bu workflow'u kullanacağız. Şimdilik dursun.
  android-release-build:
    name: Android Release Build (AAB - Play Store)
    max_build_duration: 30
    environment:
      flutter: stable
