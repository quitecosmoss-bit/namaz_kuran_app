workflows:
  android-test-build:
    name: Android Test Build (APK)
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Eksikse Android platform klasörünü oluştur
        script: |
          flutter create --platforms=android --org com.namazkuran --project-name namaz_kuran_app .
      - name: Uygulamanın compileSdk sürümünü yükselt
        script: |
          FILE=""
          if [ -f android/app/build.gradle.kts ]; then
            FILE=android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            FILE=android/app/build.gradle
          fi
          if [ -n "$FILE" ]; then
            sed -i.bak 's/flutter\.compileSdkVersion/36/g' "$FILE"
            rm -f "$FILE.bak"
          fi
      - name: Tüm alt modüllerin (paketler dahil) compileSdk'sini zorla yükselt
        script: |
          KTS=android/build.gradle.kts
          GROOVY=android/build.gradle
          if [ -f "$KTS" ]; then
            {
              echo ""
              echo "subprojects {"
              echo "    afterEvaluate {"
              echo "        val androidExt = extensions.findByName(\"android\")"
              echo "        if (androidExt is com.android.build.gradle.BaseExtension) {"
              echo "            androidExt.compileSdkVersion(36)"
              echo "        }"
              echo "    }"
              echo "}"
            } >> "$KTS"
            echo "Eklendi: $KTS"
          elif [ -f "$GROOVY" ]; then
            {
              echo ""
              echo "subprojects {"
              echo "    afterEvaluate { proj ->"
              echo "        if (proj.hasProperty('android')) {"
              echo "            proj.android {"
              echo "                compileSdkVersion 36"
              echo "            }"
              echo "        }"
              echo "    }"
              echo "}"
            } >> "$GROOVY"
            echo "Eklendi: $GROOVY"
          fi
      - name: Konum ve internet izinlerini AndroidManifest.xml'e ekle
        script: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            awk '/<manifest /{print; print "    <uses-permission android:name=\"android.permission.INTERNET\" />"; print "    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />"; print "    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />"; next}1' "$MANIFEST" > "$MANIFEST.tmp"
            mv "$MANIFEST.tmp" "$MANIFEST"
          fi
      - name: Paketleri indir
        script: flutter pub get
      - name: Testleri çalıştır (varsa)
        script: flutter test || true
      - name: Debug APK derle (imzasız, hızlı test için)
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  # Play Store'a yüklenecek release build için, keystore (imzalama anahtarı)
  # hazır olduğunda bu workflow'u kullanacağız. Şimdilik dursun.
  android-release-build:
    name: Android Release Build (AAB - Play Store)
    max_build_duration: 30
    environment:
      flutter: stable
      android_signing:
        - keystore_reference # Codemagic panelinden keystore yükleyince bu isim otomatik eşleşir
    scripts:
      - name: Eksikse Android platform klasörünü oluştur
        script: |
          flutter create --platforms=android --org com.namazkuran --project-name namaz_kuran_app .
      - name: Uygulamanın compileSdk sürümünü yükselt
        script: |
          FILE=""
          if [ -f android/app/build.gradle.kts ]; then
            FILE=android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            FILE=android/app/build.gradle
          fi
          if [ -n "$FILE" ]; then
            sed -i.bak 's/flutter\.compileSdkVersion/36/g' "$FILE"
            rm -f "$FILE.bak"
          fi
      - name: Tüm alt modüllerin (paketler dahil) compileSdk'sini zorla yükselt
        script: |
          KTS=android/build.gradle.kts
          GROOVY=android/build.gradle
          if [ -f "$KTS" ]; then
            {
              echo ""
              echo "subprojects {"
              echo "    afterEvaluate {"
              echo "        val androidExt = extensions.findByName(\"android\")"
              echo "        if (androidExt is com.android.build.gradle.BaseExtension) {"
              echo "            androidExt.compileSdkVersion(36)"
              echo "        }"
              echo "    }"
              echo "}"
            } >> "$KTS"
            echo "Eklendi: $KTS"
          elif [ -f "$GROOVY" ]; then
            {
              echo ""
              echo "subprojects {"
              echo "    afterEvaluate { proj ->"
              echo "        if (proj.hasProperty('android')) {"
              echo "            proj.android {"
              echo "                compileSdkVersion 36"
              echo "            }"
              echo "        }"
              echo "    }"
              echo "}"
            } >> "$GROOVY"
            echo "Eklendi: $GROOVY"
          fi
      - name: Konum ve internet izinlerini AndroidManifest.xml'e ekle
        script: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            awk '/<manifest /{print; print "    <uses-permission android:name=\"android.permission.INTERNET\" />"; print "    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />"; print "    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />"; next}1' "$MANIFEST" > "$MANIFEST.tmp"
            mv "$MANIFEST.tmp" "$MANIFEST"
          fi
      - name: Paketleri indir
        script: flutter pub get
      - name: Release AAB derle (Play Store için)
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
