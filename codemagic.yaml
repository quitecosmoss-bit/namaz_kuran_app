workflows:
  android-test-build:
    name: Android Test Build (APK)
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Eksikse Android platform klasörünü oluştur
        script: |
          flutter create --platforms=android --org com.namazkuran --project-name namaz_kuran_app .
      - name: Android compileSdk sürümünü yükselt
        script: |
          KTS=android/app/build.gradle.kts
          GROOVY=android/app/build.gradle
          if [ -f "$KTS" ]; then
            sed -i.bak 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$KTS"
            rm -f "$KTS.bak"
          elif [ -f "$GROOVY" ]; then
            sed -i.bak 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' "$GROOVY"
            rm -f "$GROOVY.bak"
          fi
      - name: Konum ve internet izinlerini AndroidManifest.xml'e ekle
        script: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            awk '/<manifest /{print; print "    <uses-permission android:name=\"android.permission.INTERNET\" />"; print "    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />"; print "    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />"; next}1' "$MANIFEST" > "$MANIFEST.tmp"
            mv "$MANIFEST.tmp" "$MANIFEST"
          fi
      - name: Paketleri indir
        script: flutter pub get
      - name: Testleri çalıştır (varsa)
        script: flutter test || true
      - name: Debug APK derle (imzasız, hızlı test için)
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  # Play Store'a yüklenecek release build için, keystore (imzalama anahtarı)
  # hazır olduğunda bu workflow'u kullanacağız. Şimdilik dursun.
  android-release-build:
    name: Android Release Build (AAB - Play Store)
    max_build_duration: 30
    environment:
      flutter: stable
      android_signing:
        - keystore_reference # Codemagic panelinden keystore yükleyince bu isim otomatik eşleşir
    scripts:
      - name: Eksikse Android platform klasörünü oluştur
        script: |
          flutter create --platforms=android --org com.namazkuran --project-name namaz_kuran_app .
      - name: Android compileSdk sürümünü yükselt
        script: |
          KTS=android/app/build.gradle.kts
          GROOVY=android/app/build.gradle
          if [ -f "$KTS" ]; then
            sed -i.bak 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$KTS"
            rm -f "$KTS.bak"
          elif [ -f "$GROOVY" ]; then
            sed -i.bak 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' "$GROOVY"
            rm -f "$GROOVY.bak"
          fi
      - name: Konum ve internet izinlerini AndroidManifest.xml'e ekle
        script: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            awk '/<manifest /{print; print "    <uses-permission android:name=\"android.permission.INTERNET\" />"; print "    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />"; print "    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />"; next}1' "$MANIFEST" > "$MANIFEST.tmp"
            mv "$MANIFEST.tmp" "$MANIFEST"
          fi
      - name: Paketleri indir
        script: flutter pub get
      - name: Release AAB derle (Play Store için)
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
